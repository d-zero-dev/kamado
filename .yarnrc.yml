nodeLinker: node-modules
npmRegistryServer: 'https://registry.npmjs.org'
enableGlobalCache: true

# 依存パッケージの install / postinstall スクリプトを実行しない。
# サプライチェーン攻撃の主要経路（悪意ある postinstall による任意コード実行）を
# 塞ぐ。スクリプトが要る依存だけを許可する場合は、package.json の
# `dependenciesMeta.<package>.built: true` で個別に有効にできる。
# ワークスペース自身の postinstall（husky）はこの設定の対象外で、実行される。
enableScripts: false

# npm publish 後 7 日経過していないパッケージを依存解決から除外する
# サプライチェーン保護。typosquatting や即時 takedown が走ったパッケージを
# 取り込まないためのセーフティガード。
#
# 自社パッケージ（@d-zero/*）の publish 直後に取り込みたい場合は、本ファイルを
# 編集せず、そのコマンドだけ環境変数 `YARN_NPM_MINIMAL_AGE_GATE=0` を付けて実行する
# （`yarn.lock` に版が固定される）。設定ファイルを書き換える手順は、元に戻し忘れると
# リポジトリ全体で保護が外れ続けるため使わない。
#
# Yarn 4 リファレンス: https://yarnpkg.com/configuration/yarnrc#npmMinimalAgeGate
npmMinimalAgeGate: 7d

# `yarn add` でバージョンを固定する（`^` / `~` を付けない）。
defaultSemverRangePrefix: ''
