name: Rust

on:
  push:
    branches:
      # main gets the release commit (`lerna version`), which changes Cargo.lock.
      - main
      - dev
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/**'
      - 'packages/kamado/**'
      - 'benchmarks/**'
      - '.github/workflows/rust.yml'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/**'
      - 'packages/kamado/**'
      - 'benchmarks/**'
      - '.github/workflows/rust.yml'

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macOS-latest
          - ubuntu-latest
          - ubuntu-24.04-arm
        node: [26]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}

      # Some tests run the esbuild binary of node_modules (the minification of
      # inline scripts).
      - name: Enable Corepack and setup Yarn v4
        run: |
          npm install -g corepack
          corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # The toolchain version is pinned here, not in rust-toolchain.toml: a
      # toolchain file makes every local `cargo` call reinstall that version.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.1
          rustc --version

      # There are no external crates, so only the build output is worth caching.
      - name: Cache Rust build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target
          key: rust-${{ matrix.os }}-1.98.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml') }}

      - name: No external crates
        run: node scripts/check-rust-no-external-crates.mjs

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --offline --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --offline --workspace

      - name: Build addon
        run: cargo build --locked --offline --release -p kd_napi

      - name: Load addon from Node (main thread and workers)
        run: node --test crates/kd_napi/check/load.check.mjs

      # The shipped addon has no way to panic on purpose; this build adds one. A panic
      # has to be an Error in JS, which only a release build can show (`cargo test` unwinds).
      - name: Build the addon with the panic check
        run: cargo build --locked --offline --release -p kd_napi --features panic-check --target-dir target/panic-check

      - name: A panic in the addon is a JS Error
        run: node --test crates/kd_napi/check/panic.check.mjs

      - name: Build the Node package
        run: yarn build

      # The Node package finds the addon in target/release.
      - name: Run the whole pipeline through the CLI
        run: node --test crates/kd_napi/check/pipeline.check.mjs
