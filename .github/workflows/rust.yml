name: Rust

on:
  push:
    branches:
      # main gets the release commit (`lerna version`), which changes Cargo.lock.
      - main
      - dev
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/**'
      - 'packages/kamado/**'
      - 'benchmarks/**'
      - '.github/workflows/rust.yml'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/**'
      - 'packages/kamado/**'
      - 'benchmarks/**'
      - '.github/workflows/rust.yml'

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macOS-latest
          - ubuntu-latest
          - ubuntu-24.04-arm
        node: [26]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      # Some tests run the esbuild binary of node_modules (the minification of
      # inline scripts).
      - name: Enable Corepack and setup Yarn v4
        run: |
          npm install -g corepack
          corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # The toolchain version is pinned here, not in rust-toolchain.toml: a
      # toolchain file makes every local `cargo` call reinstall that version.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.1
          rustc --version

      # There are no external crates, so only the build output is worth caching.
      - name: Cache Rust build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: rust-${{ matrix.os }}-1.98.1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml') }}

      - name: No external crates
        run: node scripts/check-rust-no-external-crates.mjs

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --offline --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --offline --workspace

      - name: Build addon
        run: cargo build --locked --offline --release -p kd_napi

      - name: Load addon from Node (main thread and workers)
        run: node --test crates/kd_napi/check/load.check.mjs

      # The shipped addon has no way to panic on purpose; this build adds one. A panic
      # has to be an Error in JS, which only a release build can show (`cargo test` unwinds).
      - name: Build the addon with the panic check
        run: cargo build --locked --offline --release -p kd_napi --features panic-check --target-dir target/panic-check

      - name: A panic in the addon is a JS Error
        run: node --test crates/kd_napi/check/panic.check.mjs

      - name: Build the Node package
        run: yarn build

      # The Node package finds the addon in target/release.
      - name: Run the whole pipeline through the CLI
        run: node --test crates/kd_napi/check/pipeline.check.mjs

      # The JSON that crosses the addon is the one RFC §14.2 says, and an edit changes the
      # files on disk and nothing else.
      - name: Edit the pages through the addon
        run: node --test crates/kd_napi/check/ui.check.mjs

      # A sync (RFC §14.2): what is applied makes the pages what the script returned, what is
      # returned again changes nothing, and a sync that fails or finds a file changed leaves every
      # byte as it was. The cases are made from fixed seeds.
      - name: Sync the pages with a script through the addon
        run: node --test crates/kd_napi/check/sync.check.mjs

      # The range of a sync (select) and an export (write): an import changes only what select
      # names, an export writes nothing before it is confirmed and nothing when a file changed
      # meanwhile, and it never changes the files of the site.
      - name: Import with a range and export through the addon
        run: node --test crates/kd_napi/check/sync-select.check.mjs

      # A relative cache directory is relative to the config file for the API and to the
      # directory the command was typed in for --cache-dir (RFC §13).
      - name: Resolve a relative cache directory
        run: node --test crates/kd_napi/check/cache-dir.check.mjs

      # A JSX page is rebuilt when a key of data it read changes and not otherwise, and
      # --verify-deps finds a page that depends on what another page left in a module (RFC §11).
      - name: Rebuild pages by the data keys they read
        run: node --test crates/kd_napi/check/data-keys.check.mjs

      # The data files that are scripts run in a build and in the dev server, a page is built
      # again only when a key it read changed, and a file that fails fails only its readers
      # (RFC §3.2).
      - name: Run the data files that are scripts
        run: node --test crates/kd_napi/check/data-scripts.check.mjs
