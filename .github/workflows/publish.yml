name: Publish

# `kamado` carries the addon of every platform in one package. The addons are built on
# their own platforms, packed into one tarball, loaded from that tarball on each platform,
# and only then is the same tarball published. `@kamado-io/oxlint` (plain JavaScript, the
# rules for the JSX of kamado) is packed in the same run and published after `kamado`, with
# the same version. A run started by hand (workflow_dispatch) stops before the publish job:
# it is a dry run of everything else.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      dist-tag: ${{ steps.dist-tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.13.0

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./lerna.json').version")" >> "$GITHUB_OUTPUT"

      # `yarn release*` updates Cargo.toml and Cargo.lock; a hand-made tag on a commit
      # that skipped it would publish an addon that reports another version.
      - name: Cargo version equals the package version
        run: node scripts/sync-cargo-version.mjs --check

      - name: Package versions equal the lerna version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for PACKAGE_JSON in packages/kamado/package.json packages/@kamado-io/oxlint/package.json; do
            PACKAGE=$(node -p "require('./$PACKAGE_JSON').version")
            if [[ "$PACKAGE" != "$VERSION" ]]; then
              echo "$PACKAGE_JSON is $PACKAGE, lerna.json is $VERSION" >&2
              exit 1
            fi
          done

      # npm cannot set up Trusted Publishing for a package that is not on the registry yet:
      # the first version of a new package is published by hand, and then the package gets its
      # trusted publisher (docs/v3/development.md). Failing here, before anything is published,
      # stops a release that the publish job could not finish. A dry run (workflow_dispatch)
      # publishes nothing, and does not look.
      #
      # The registry is asked with curl, and only a 200 and a 404 are answers: a failure of the
      # network, or a 5xx, is neither "it is there" nor "it is not".
      - name: '@kamado-io/oxlint is on npm'
        if: github.ref_type == 'tag'
        run: |
          STATUS=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://registry.npmjs.org/@kamado-io%2Foxlint")
          case "$STATUS" in
            200) ;;
            404)
              echo "@kamado-io/oxlint is not on npm yet: publish its first version by hand and set its trusted publisher (docs/v3/development.md)" >&2
              exit 1
              ;;
            *)
              echo "the registry answered $STATUS" >&2
              exit 1
              ;;
          esac

      - name: Tag equals the version
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "tag $GITHUB_REF_NAME, version v$VERSION" >&2
            exit 1
          fi

      - name: Determine dist-tag
        id: dist-tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$VERSION" == *"-alpha"* ]]; then
            echo "tag=alpha" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == *"-beta"* ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == *"-rc"* ]]; then
            echo "tag=rc" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == *"-"* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

  addon:
    needs: check

    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-latest
          - platform: darwin-x64
            runner: macos-15-intel
          # The oldest glibc of the runners (2.35): a binary links against the glibc of
          # the machine that builds it, and older systems (Ubuntu 22.04 on WSL2) must
          # still load it.
          - platform: linux-x64
            runner: ubuntu-22.04
          - platform: linux-arm64
            runner: ubuntu-22.04-arm

    runs-on: ${{ matrix.runner }}

    env:
      # The oldest macOS that Node 24 supports.
      MACOSX_DEPLOYMENT_TARGET: '13.5'

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.13.0

      # Same pin as rust.yml.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustc --version

      - name: Build addon
        run: cargo build --locked --offline --release -p kd_napi

      - name: Load addon from Node (main thread and workers)
        run: node --test crates/kd_napi/check/load.check.mjs

      - name: Place addon
        run: |
          mkdir -p "native/${{ matrix.platform }}"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            cp target/release/libkd_napi.dylib "native/${{ matrix.platform }}/kd_napi.node"
          else
            cp target/release/libkd_napi.so "native/${{ matrix.platform }}/kd_napi.node"
          fi

      - name: Upload addon
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: addon-${{ matrix.platform }}
          # The directory, not the file: a single file would be stored without its
          # `<os>-<arch>/` directory, and the four artifacts would overwrite each other.
          path: native
          if-no-files-found: error
          retention-days: 7

  package:
    needs: [check, addon]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Corepack
        run: npm install -g corepack

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.13.0

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      # Each artifact holds `<os>-<arch>/kd_napi.node`; they merge into `native/`.
      - name: Download addons
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: addon-*
          path: packages/kamado/native
          merge-multiple: true

      - name: Pack
        run: yarn workspace kamado pack --out "$GITHUB_WORKSPACE/kamado.tgz"

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: kamado.tgz
          if-no-files-found: error
          retention-days: 7

      # Plain JavaScript, so there is no platform to load it on: the tarball is unpacked and
      # the plugin is loaded from it, as `exports` names it. It reads its own package.json as it
      # is loaded, so a tarball without one fails here and not in somebody's lint.
      - name: Pack @kamado-io/oxlint
        run: yarn workspace @kamado-io/oxlint pack --out "$GITHUB_WORKSPACE/kamado-io-oxlint.tgz"

      - name: The packed plugin loads
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          mkdir "$RUNNER_TEMP/oxlint-package"
          tar -xzf kamado-io-oxlint.tgz -C "$RUNNER_TEMP/oxlint-package"
          test -f "$RUNNER_TEMP/oxlint-package/package/dist/index.d.ts"
          node --input-type=module --eval '
            import { pathToFileURL } from "node:url";
            const { default: plugin } = await import(pathToFileURL(process.argv[1]).href);
            const names = Object.keys(plugin.rules);
            if (plugin.meta.name !== "@kamado-io" || plugin.meta.version !== process.argv[2] || names.length === 0) {
              throw new Error(`the packed plugin is ${plugin.meta.name}@${plugin.meta.version} with ${names.length} rules`);
            }
          ' "$RUNNER_TEMP/oxlint-package/package/dist/index.js" "$VERSION"

      - name: Upload @kamado-io/oxlint
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-oxlint
          path: kamado-io-oxlint.tgz
          if-no-files-found: error
          retention-days: 7

  # Loads the addon from the tarball that will be published, on every platform it
  # carries, plus Ubuntu 24.04 (the build is on 22.04).
  smoke:
    needs: package

    strategy:
      fail-fast: true
      matrix:
        runner:
          - macos-latest
          - macos-15-intel
          - ubuntu-22.04
          - ubuntu-22.04-arm
          - ubuntu-24.04

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.13.0

      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/download

      - name: Unpack
        run: |
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf "$RUNNER_TEMP/download/kamado.tgz" -C "$RUNNER_TEMP/unpacked"

      # The script lives in the checkout; the unpacked package is only data.
      - name: Load the bundled addon
        run: node scripts/check-package-addon.mjs "$RUNNER_TEMP/unpacked/package"

      - name: Check the screen of kamado ui
        run: node scripts/check-package-ui.mjs "$RUNNER_TEMP/unpacked/package"

  publish:
    if: github.ref_type == 'tag'
    needs: [check, smoke]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.13.0
          registry-url: 'https://registry.npmjs.org'

      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/download

      - name: Download @kamado-io/oxlint
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-oxlint
          path: ${{ runner.temp }}/download-oxlint

      # OIDC Trusted Publishing: no token. npm adds the provenance itself.
      #
      # `@kamado-io/oxlint` goes first: `kamado` does not depend on it, so when the second publish
      # fails, what is out is the package that nothing needs, and not a `kamado` that the
      # README sends to an oxlint package of the same version that is not there.
      #
      # A version that is on npm already is skipped, so that the run can be started again after
      # a failure. The registry is asked with curl, and only a 200 and a 404 are answers: `npm
      # view` sends the placeholder token that setup-node writes into .npmrc, which the registry
      # may refuse, and a failure of the network is neither "it is there" nor "it is not".
      - name: Publish @kamado-io/oxlint
        env:
          DIST_TAG: ${{ needs.check.outputs.dist-tag }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          STATUS=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://registry.npmjs.org/@kamado-io%2Foxlint/$VERSION")
          case "$STATUS" in
            200) echo "@kamado-io/oxlint@$VERSION is on npm already" ;;
            404) npm publish "$RUNNER_TEMP/download-oxlint/kamado-io-oxlint.tgz" --tag "$DIST_TAG" --provenance ;;
            *)
              echo "the registry answered $STATUS" >&2
              exit 1
              ;;
          esac

      - name: Publish kamado
        env:
          DIST_TAG: ${{ needs.check.outputs.dist-tag }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          STATUS=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://registry.npmjs.org/kamado/$VERSION")
          case "$STATUS" in
            200) echo "kamado@$VERSION is on npm already" ;;
            404) npm publish "$RUNNER_TEMP/download/kamado.tgz" --tag "$DIST_TAG" --provenance ;;
            *)
              echo "the registry answered $STATUS" >&2
              exit 1
              ;;
          esac
