[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# Kept equal to lerna.json by scripts/sync-cargo-version.mjs (run by `yarn release*`, which wraps `lerna version`).
version = "3.0.0-alpha.2"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.98"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
