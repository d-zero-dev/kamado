[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# Kept equal to lerna.json by scripts/sync-cargo-version.mjs (run by `yarn release*`, which wraps `lerna version`).
version = "3.0.0-alpha.2"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.98"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Not `abort`: a panic has to unwind to the edge of the addon (`kd_napi::guard`), where it
# becomes a JS exception; `abort` would end the whole Node process (and the dev server
# with it). `kd_pool` also hands a panic of a job to the thread that waits for it.
panic = "unwind"
strip = "symbols"
debug = false
